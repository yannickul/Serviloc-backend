server:
  port: 8081

spring:
  application:
    name: service-utilisateurs

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

  datasource:
    url: ${DB_UTILISATEURS_URL:jdbc:postgresql://localhost:5441/${POSTGRES_USER_DB}}
    username: ${POSTGRES_USER_USER}
    password: ${POSTGRES_USER_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 60000
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}
    virtual-host: ${RABBITMQ_VHOST}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME}
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 86400000
  issuer: serviloc

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

internal:
  token: ${INTERNAL_TOKEN}

logging:
  #pattern:
    #console: "%d{HH:mm:ss.SSS} %-5level [%thread] [correlationId=%X{correlationId:-none}] %logger{36} - %msg%n"
  level:
    com.serviloc: DEBUG
   #org.springframework.amqp: INFO
