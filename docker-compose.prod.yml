# =============================================================================
# ServiLoc — Docker Compose — PRODUCTION (VPS 12 Go RAM, backend + front)
# =============================================================================
#
# Toutes les JVM sont bridées (-Xmx) et tous les conteneurs ont un mem_limit
# dur pour ne jamais dépasser la RAM du VPS. Total estimé ~9.4 Go, laissant
# ~2.6 Go de marge pour l'OS et les pics de démarrage.
#
# Ordre de démarrage géré par depends_on + healthcheck :
#   eureka-server → rabbitmq/redis/8xPostgres → microservices → api-gateway
#
# Usage :
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f api-gateway
#   docker compose -f docker-compose.prod.yml ps
# =============================================================================

x-jvm-small: &jvm-small
  JAVA_TOOL_OPTIONS: "-Xmx400m -Xms200m -XX:+UseG1GC"

x-pg-small: &pg-small
  command: >
    postgres
    -c shared_buffers=64MB
    -c max_connections=30
    -c work_mem=4MB
    -c maintenance_work_mem=32MB
  mem_limit: 200m

services:

  # ===========================================================================
  # EUREKA SERVER
  # ===========================================================================
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    image: serviloc/eureka-server:latest
    container_name: serviloc-eureka
    hostname: eureka-server
    ports:
      - "8761:8761"
    environment:
      <<: *jvm-small
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    mem_limit: 400m
    networks: [serviloc-network]
    restart: unless-stopped

  # ===========================================================================
  # RABBITMQ
  # ===========================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: serviloc-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "61613:61613"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 400m
    networks: [serviloc-network]
    restart: unless-stopped

  # ===========================================================================
  # REDIS
  # ===========================================================================
  redis:
    image: redis:7.2-alpine
    container_name: serviloc-redis
    hostname: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 150m
    networks: [serviloc-network]
    restart: unless-stopped

  # ===========================================================================
  # POSTGRES — 8 bases, une par microservice avec état
  # ===========================================================================
  db-utilisateurs:
    image: postgres:16-alpine
    container_name: serviloc-db-utilisateurs
    hostname: db-utilisateurs
    <<: *pg-small
    environment:
      POSTGRES_DB: ${POSTGRES_USER_DB}
      POSTGRES_USER: ${POSTGRES_USER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_USER_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes: [db_utilisateurs_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_USER} -d ${POSTGRES_USER_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [serviloc-network]
    restart: unless-stopped

  db-missions:
    image: postgres:16-alpine
    container_name: serviloc-db-missions
    hostname: db-missions
    <<: *pg-small
    environment:
      POSTGRES_DB: ${POSTGRES_MISSIONS_DB}
      POSTGRES_USER: ${POSTGRES_MISSIONS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_MISSIONS_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes: [db_missions_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_MISSIONS_USER} -d ${POSTGRES_MISSIONS_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [serviloc-network]
    restart: unless-stopped

  db-negociations:
    image: postgres:16-alpine
    container_name: serviloc-db-negociations
    hostname: db-negociations
    <<: *pg-small
    environment:
      POSTGRES_DB: ${POSTGRES_NEGO_DB}
      POSTGRES_USER: ${POSTGRES_NEGO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_NEGO_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes: [db_negociations_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_NEGO_USER} -d ${POSTGRES_NEGO_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [serviloc-network]
    restart: unless-stopped

  db-paiement:
    image: postgres:16-alpine
    container_name: serviloc-db-paiement
    hostname: db-paiement
    <<: *pg-small
    environment:
      POSTGRES_DB: ${POSTGRES_PAIEMENT_DB}
      POSTGRES_USER: ${POSTGRES_PAIEMENT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PAIEMENT_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes: [db_paiement_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_PAIEMENT_USER} -d ${POSTGRES_PAIEMENT_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [serviloc-network]
    restart: unless-stopped

  db-litiges:
    image: postgres:16-alpine
    container_name: serviloc-db-litiges
    hostname: db-litiges
    <<: *pg-small
    environment:
      POSTGRES_DB: ${POSTGRES_LITIGES_DB}
      POSTGRES_USER: ${POSTGRES_LITIGES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_LITIGES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes: [db_litiges_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_LITIGES_USER} -d ${POSTGRES_LITIGES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [serviloc-network]
    restart: unless-stopped

  db-notifications:
    image: postgres:16-alpine
    container_name: serviloc-db-notifications
    hostname: db-notifications
    <<: *pg-small
    environment:
      POSTGRES_DB: ${POSTGRES_NOTIFS_DB}
      POSTGRES_USER: ${POSTGRES_NOTIFS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_NOTIFS_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes: [db_notifications_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_NOTIFS_USER} -d ${POSTGRES_NOTIFS_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [serviloc-network]
    restart: unless-stopped

  db-categories:
    image: postgres:16-alpine
    container_name: serviloc-db-categories
    hostname: db-categories
    <<: *pg-small
    environment:
      POSTGRES_DB: ${POSTGRES_CATEGORIES_DB}
      POSTGRES_USER: ${POSTGRES_CATEGORIES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CATEGORIES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes: [db_categories_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_CATEGORIES_USER} -d ${POSTGRES_CATEGORIES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [serviloc-network]
    restart: unless-stopped

  db-media:
    image: postgres:16-alpine
    container_name: serviloc-db-media
    hostname: db-media
    <<: *pg-small
    environment:
      POSTGRES_DB: ${POSTGRES_MEDIA_DB}
      POSTGRES_USER: ${POSTGRES_MEDIA_USER}
      POSTGRES_PASSWORD: ${POSTGRES_MEDIA_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes: [db_media_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_MEDIA_USER} -d ${POSTGRES_MEDIA_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [serviloc-network]
    restart: unless-stopped

  # ===========================================================================
  # MINIO
  # ===========================================================================
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: serviloc-minio
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: 300m
    networks: [serviloc-network]
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: serviloc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/$${MINIO_BUCKET};
        mc anonymous set download local/$${MINIO_BUCKET};
        echo 'Bucket ready.';
      "
    networks: [serviloc-network]
    restart: "no"

  # ===========================================================================
  # MICROSERVICES — chacun dans son conteneur, dépend de sa DB + eureka
  # Adapte "context" au chemin réel du dossier de chaque service dans ton repo.
  # ===========================================================================

  service-utilisateurs:
    build: { context: ./service-utilisateurs, dockerfile: Dockerfile }
    image: serviloc/service-utilisateurs:latest
    container_name: serviloc-service-utilisateurs
    hostname: service-utilisateurs
    environment:
      <<: *jvm-small
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_HOST: eureka-server
      DB_UTILISATEURS_URL: jdbc:postgresql://db-utilisateurs:5432/${POSTGRES_USER_DB}
      POSTGRES_USER_USER: ${POSTGRES_USER_USER}
      POSTGRES_USER_PASSWORD: ${POSTGRES_USER_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    depends_on:
      eureka-server: { condition: service_healthy }
      db-utilisateurs: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 512m
    networks: [serviloc-network]
    restart: unless-stopped

  service-missions:
    build: { context: ./service-missions, dockerfile: Dockerfile }
    image: serviloc/service-missions:latest
    container_name: serviloc-service-missions
    hostname: service-missions
    environment:
      <<: *jvm-small
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_HOST: eureka-server
      DB_MISSIONS_URL: jdbc:postgresql://db-missions:5432/${POSTGRES_MISSIONS_DB}
      POSTGRES_MISSIONS_USER: ${POSTGRES_MISSIONS_USER}
      POSTGRES_MISSIONS_PASSWORD: ${POSTGRES_MISSIONS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    depends_on:
      eureka-server: { condition: service_healthy }
      db-missions: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 512m
    networks: [serviloc-network]
    restart: unless-stopped

  service-negociations:
    build: { context: ./service-negociations, dockerfile: Dockerfile }
    image: serviloc/service-negociations:latest
    container_name: serviloc-service-negociations
    hostname: service-negociations
    environment:
      <<: *jvm-small
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_HOST: eureka-server
      DB_NEGO_URL: jdbc:postgresql://db-negociations:5432/${POSTGRES_NEGO_DB}
      POSTGRES_NEGO_USER: ${POSTGRES_NEGO_USER}
      POSTGRES_NEGO_PASSWORD: ${POSTGRES_NEGO_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    depends_on:
      eureka-server: { condition: service_healthy }
      db-negociations: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    mem_limit: 512m
    networks: [serviloc-network]
    restart: unless-stopped

  service-paiement:
    build: { context: ./service-paiement, dockerfile: Dockerfile }
    image: serviloc/service-paiement:latest
    container_name: serviloc-service-paiement
    hostname: service-paiement
    environment:
      <<: *jvm-small
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_HOST: eureka-server
      DB_PAIEMENT_URL: jdbc:postgresql://db-paiement:5432/${POSTGRES_PAIEMENT_DB}
      POSTGRES_PAIEMENT_USER: ${POSTGRES_PAIEMENT_USER}
      POSTGRES_PAIEMENT_PASSWORD: ${POSTGRES_PAIEMENT_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    depends_on:
      eureka-server: { condition: service_healthy }
      db-paiement: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    mem_limit: 512m
    networks: [serviloc-network]
    restart: unless-stopped

  service-litiges:
    build: { context: ./service-litiges, dockerfile: Dockerfile }
    image: serviloc/service-litiges:latest
    container_name: serviloc-service-litiges
    hostname: service-litiges
    environment:
      <<: *jvm-small
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_HOST: eureka-server
      DB_LITIGES_URL: jdbc:postgresql://db-litiges:5432/${POSTGRES_LITIGES_DB}
      POSTGRES_LITIGES_USER: ${POSTGRES_LITIGES_USER}
      POSTGRES_LITIGES_PASSWORD: ${POSTGRES_LITIGES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    depends_on:
      eureka-server: { condition: service_healthy }
      db-litiges: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    mem_limit: 512m
    networks: [serviloc-network]
    restart: unless-stopped

  service-notifications:
    build: { context: ./service-notifications, dockerfile: Dockerfile }
    image: serviloc/service-notifications:latest
    container_name: serviloc-service-notifications
    hostname: service-notifications
    environment:
      <<: *jvm-small
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_HOST: eureka-server
      DB_NOTIFS_URL: jdbc:postgresql://db-notifications:5432/${POSTGRES_NOTIFS_DB}
      POSTGRES_NOTIFS_USER: ${POSTGRES_NOTIFS_USER}
      POSTGRES_NOTIFS_PASSWORD: ${POSTGRES_NOTIFS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    depends_on:
      eureka-server: { condition: service_healthy }
      db-notifications: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    mem_limit: 512m
    networks: [serviloc-network]
    restart: unless-stopped

  service-categories:
    build: { context: ./service-categories, dockerfile: Dockerfile }
    image: serviloc/service-categories:latest
    container_name: serviloc-service-categories
    hostname: service-categories
    environment:
      <<: *jvm-small
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_HOST: eureka-server
      DB_CATEGORIES_URL: jdbc:postgresql://db-categories:5432/${POSTGRES_CATEGORIES_DB}
      POSTGRES_CATEGORIES_USER: ${POSTGRES_CATEGORIES_USER}
      POSTGRES_CATEGORIES_PASSWORD: ${POSTGRES_CATEGORIES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    depends_on:
      eureka-server: { condition: service_healthy }
      db-categories: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    mem_limit: 512m
    networks: [serviloc-network]
    restart: unless-stopped

  service-fichiers:
    build: { context: ./service-fichiers, dockerfile: Dockerfile }
    image: serviloc/service-fichiers:latest
    container_name: serviloc-service-fichiers
    hostname: service-fichiers
    environment:
      <<: *jvm-small
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_HOST: eureka-server
      DB_MEDIA_URL: jdbc:postgresql://db-media:5432/${POSTGRES_MEDIA_DB}
      POSTGRES_MEDIA_USER: ${POSTGRES_MEDIA_USER}
      POSTGRES_MEDIA_PASSWORD: ${POSTGRES_MEDIA_PASSWORD}
      MINIO_HOST: minio
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    depends_on:
      eureka-server: { condition: service_healthy }
      db-media: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    mem_limit: 512m
    networks: [serviloc-network]
    restart: unless-stopped

  # ===========================================================================
  # API GATEWAY — démarre en dernier, après tous les microservices
  # ===========================================================================
  api-gateway:
    build: { context: ./api-gateway, dockerfile: Dockerfile }
    image: serviloc/api-gateway:latest
    container_name: serviloc-api-gateway
    hostname: api-gateway
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx500m -Xms250m -XX:+UseG1GC"
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_HOST: eureka-server
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      eureka-server: { condition: service_healthy }
      redis: { condition: service_healthy }
      service-utilisateurs: { condition: service_started }
      service-missions: { condition: service_started }
      service-negociations: { condition: service_started }
      service-paiement: { condition: service_started }
      service-litiges: { condition: service_started }
      service-notifications: { condition: service_started }
      service-categories: { condition: service_started }
      service-fichiers: { condition: service_started }
    mem_limit: 512m
    networks: [serviloc-network]
    restart: unless-stopped

  # ===========================================================================
  # FRONTEND + NGINX — sert le build statique et proxifie /v1 et /ws vers le gateway
  # ===========================================================================
  frontend:
    image: nginx:alpine
    container_name: serviloc-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
    mem_limit: 30m
    networks: [serviloc-network]
    restart: unless-stopped

# =============================================================================
volumes:
  rabbitmq_data: { name: serviloc_rabbitmq_data }
  redis_data: { name: serviloc_redis_data }
  db_utilisateurs_data: { name: serviloc_db_utilisateurs }
  db_missions_data: { name: serviloc_db_missions }
  db_negociations_data: { name: serviloc_db_negociations }
  db_paiement_data: { name: serviloc_db_paiement }
  db_litiges_data: { name: serviloc_db_litiges }
  db_notifications_data: { name: serviloc_db_notifications }
  db_categories_data: { name: serviloc_db_categories }
  db_media_data: { name: serviloc_db_media }
  minio_data: { name: serviloc_minio_data }

networks:
  serviloc-network:
    name: serviloc-network
    driver: bridge
