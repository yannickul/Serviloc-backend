server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      httpclient:
        connect-timeout: 5000
        response-timeout: 10s

      routes:

        # NOTE : GET /v1/client/dashboard, /v1/provider/dashboard, /v1/admin/dashboard
        # et /v1/admin/stats ne sont PLUS proxifiés ici : ils sont servis localement par
        # DashboardAggregatorController (le Gateway agrège plusieurs microservices en un
        # seul appel). Sécurité JWT/rôle assurée par DashboardAuthWebFilter.

        # ── Service Utilisateurs ──────────────────────────────────
        - id: utilisateurs-auth
          uri: lb://service-utilisateurs
          predicates:
            - Path=/v1/auth/**
          filters:
            - StripPrefix=1

        - id: utilisateurs-client
          uri: lb://service-utilisateurs
          predicates:
            - Path=/v1/client/me, /v1/client/profile
          filters:
            - StripPrefix=1
            - JwtAuthFilter
            - RoleAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@roleKeyResolver}"

        - id: utilisateurs-provider
          uri: lb://service-utilisateurs
          predicates:
            - Path=/v1/provider/me, /v1/provider/profile, /v1/provider/availability, /v1/provider/schedule
          filters:
            - StripPrefix=1
            - JwtAuthFilter
            - RoleAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@roleKeyResolver}"

        - id: utilisateurs-admin
          uri: lb://service-utilisateurs
          predicates:
            - Path=/v1/admin/users/**, /v1/admin/providers/**
          filters:
            - StripPrefix=1
            - JwtAuthFilter
            - RoleAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@roleKeyResolver}"

        # GET /v1/user/{id} : profil simplifié, accessible à tout rôle authentifié
        # (chemin sans préfixe /client, /provider, /admin, /agent → RoleAuthFilter
        # laisse passer sans vérification de rôle, seul JwtAuthFilter s'applique).
        - id: utilisateurs-user
          uri: lb://service-utilisateurs
          predicates:
            - Path=/v1/user/{id}
          filters:
            - StripPrefix=1
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@roleKeyResolver}"

        # ── Service Missions ──────────────────────────────────────
        - id: missions-client
          uri: lb://service-missions
          predicates:
            - Path=/v1/client/demands/**, /v1/client/missions/**, /v1/client/providers/search
          filters:
            - StripPrefix=1
            - JwtAuthFilter
            - RoleAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@roleKeyResolver}"

        - id: missions-provider
          uri: lb://service-missions
          predicates:
            - Path=/v1/provider/demands/**, /v1/provider/missions/**
          filters:
            - StripPrefix=1
            - JwtAuthFilter
            - RoleAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@roleKeyResolver}"

        # NOTE : l'ancienne route "missions-admin" (Path=/v1/admin/dashboard, /v1/admin/stats,
        # /v1/admin/transactions/**) a été supprimée. /v1/admin/dashboard et /v1/admin/stats
        # sont désormais servis par DashboardAggregatorController ; /v1/admin/transactions/**
        # est déjà couvert par la route "paiement-admin" ci-dessous (vers service-paiement,
        # le service qui implémente réellement AdminPaymentController#getTransactions).
        # La route "missions-admin" faisait doublon sur ce dernier chemin et, comme les routes
        # sans "order" explicite sont évaluées dans l'ordre de déclaration, elle l'emportait
        # sur "paiement-admin" et envoyait /admin/transactions vers le mauvais service.

        # ── Service Négociations ───────────────────────────────────
        - id: negociations-client
          uri: lb://service-negociations
          predicates:
            - Path=/v1/client/conversations/**
          filters:
            - StripPrefix=1
            - JwtAuthFilter
            - RoleAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@roleKeyResolver}"

        - id: negociations-provider
          uri: lb://service-negociations
          predicates:
            - Path=/v1/provider/conversations/**
          filters:
            - StripPrefix=1
            - JwtAuthFilter
            - RoleAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@roleKeyResolver}"


        - id: negociations-admin-chat
          uri: lb://service-negociations
          predicates:
            - Path=/v1/admin/litiges/*/chat
          filters:
            - StripPrefix=1
            - JwtAuthFilter
            - RoleAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@roleKeyResolver}"

        # ── WebSocket STOMP (chat temps réel) ──────────────────────
        # Pas de préfixe /v1 sur ce chemin → StripPrefix=0. Pas de RoleAuthFilter
        # (chat multi-rôles) ni de RequestRateLimiter (connexion persistante, pas
        # une suite de requêtes REST). Le token est passé en ?token= car l'API
        # WebSocket native des navigateurs ne permet pas de header Authorization
        # custom au handshake — voir le fallback ajouté dans JwtAuthFilter.
        - id: negociations-ws
          uri: lb://service-negociations
          predicates:
            - Path=/ws/**
          filters:
            - StripPrefix=0
            - JwtAuthFilter

        # ── Service Litiges ───────────────────────────────────────
        - id: litiges-admin
          uri: lb://service-litiges
          predicates:
            - Path=/v1/admin/litiges/**
          filters:
            - StripPrefix=1
            - JwtAuthFilter
            - RoleAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@roleKeyResolver}"

        - id: client-litiges
          uri: lb://service-litiges
          predicates:
            - Path=/v1/client/litiges/**
          filters:
            - StripPrefix=1
            - JwtAuthFilter
            - RoleAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@roleKeyResolver}"

        - id: provider-litiges
          uri: lb://service-litiges
          predicates:
            - Path=/v1/provider/litiges/**
          filters:
            - StripPrefix=1
            - JwtAuthFilter
            - RoleAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@roleKeyResolver}"

        # ── Service Catégories ────────────────────────────────────
        - id: categories-client
          uri: lb://service-categories
          predicates:
            - Path=/v1/client/categories
          filters:
            - StripPrefix=1
            - JwtAuthFilter
            - RoleAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@roleKeyResolver}"

        - id: categories-admin
          uri: lb://service-categories
          predicates:
            - Path=/v1/admin/categories/**
          filters:
            - StripPrefix=1
            - JwtAuthFilter
            - RoleAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@roleKeyResolver}"

        # ── Service Fichiers ──────────────────────────────────────
        - id: fichiers-uploads
          uri: lb://service-fichiers
          predicates:
            - Path=/v1/uploads/**
          filters:
            - StripPrefix=1
            - JwtAuthFilter
            - RoleAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@roleKeyResolver}"


        # ── Agent ─────────────────────────────────────────────────
        - id: agent-providers
          uri: lb://service-utilisateurs
          predicates:
            - Path=/v1/agent/providers/**
          filters:
            - StripPrefix=1
            - JwtAuthFilter
            - RoleAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@roleKeyResolver}"

        - id: agent-litiges
          uri: lb://service-litiges
          predicates:
            - Path=/v1/agent/litiges/**
          filters:
            - StripPrefix=1
            - JwtAuthFilter
            - RoleAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@roleKeyResolver}"

        # ── Admin Agents ──────────────────────────────────────────
        - id: admin-agents
          uri: lb://service-utilisateurs
          predicates:
            - Path=/v1/admin/agents/**
          filters:
            - StripPrefix=1
            - JwtAuthFilter
            - RoleAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@roleKeyResolver}"

        # ── Paiement Admin ────────────────────────────────────────
        - id: paiement-admin
          uri: lb://service-paiement
          predicates:
            - Path=/v1/admin/transactions/**, /v1/admin/settings/commission
          filters:
            - StripPrefix=1
            - JwtAuthFilter
            - RoleAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@roleKeyResolver}"


        - id: provider-earnings
          uri: lb://service-paiement
          predicates:
            - Path=/v1/provider/earnings
          filters:
            - StripPrefix=1
            - JwtAuthFilter
            - RoleAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@roleKeyResolver}"

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME}
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

jwt:
  secret: ${JWT_SECRET}
  issuer: serviloc

internal:
  token: ${INTERNAL_TOKEN}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

rate-limiting:
  replenish-rate: 10
  burst-capacity: 20

management:
  endpoints:
    web:
      exposure:
        include: "health,info,gateway"
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.serviloc.gateway: DEBUG