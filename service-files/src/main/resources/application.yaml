server:
  port: ${SERVER_PORT:8088}
  servlet:
    context-path: /api/files

spring:
  application:
    name: file-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:db-media}:${POSTGRES_PORT:5432}/${POSTGRES_DB:filesdb}
    username: ${POSTGRES_USER:svc_media}
    password: ${POSTGRES_PASSWORD:media_pass_2026}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true

minio:
  url: ${MINIO_URL:http://minio:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin123}
  bucket: ${MINIO_BUCKET:serviloc-media}

redis:
  host: ${REDIS_HOST:redis}
  port: ${REDIS_PORT:6379}

rabbitmq:
  host: ${RABBITMQ_HOST:rabbitmq}
  port: ${RABBITMQ_PORT:5672}
  username: ${RABBITMQ_USER:serviloc}
  password: ${RABBITMQ_PASSWORD:serviloc}

security:
  internal-token: ${INTERNAL_TOKEN:super-secret-token}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,env
  endpoint:
    health:
      show-details: always

