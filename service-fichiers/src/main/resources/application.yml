server:
  port: 8088

spring:
  application:
    name: service-fichiers

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5448}/${DB_NAME:db_media}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Africa/Douala
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 min — métadonnées fichiers changent rarement

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB    # borne haute (documents) ; contrôle fin fait en code par contexte/fichier
      max-request-size: 60MB # POST /uploads/photos accepte plusieurs fichiers (photos[])

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# --- MinIO (stockage objet compatible S3) ---
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:serviloc-media}
  public-base-url: ${MINIO_PUBLIC_URL:http://localhost:9000/serviloc-media}

# --- Sécurité inter-services (endpoints /internal/**) ---
serviloc:
  internal-token: ${INTERNAL_TOKEN}
  upload:
    photos:
      max-size-bytes: 5242880    # 5 Mo
      allowed-mime-types: image/jpeg,image/png,image/webp
    documents:
      max-size-bytes: 10485760   # 10 Mo
      allowed-mime-types: application/pdf,image/jpeg,image/png,image/webp

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: none
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.serviloc.fichiers: INFO
