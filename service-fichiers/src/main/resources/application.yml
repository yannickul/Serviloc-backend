server:
  port: 8088

spring:
  application:
    name: service-fichiers

  datasource:
    url: jdbc:postgresql://localhost:5448/${POSTGRES_MEDIA_DB:db_media}
    username: ${POSTGRES_MEDIA_USER}
    password: ${POSTGRES_MEDIA_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 60000
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Africa/Douala
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 min — métadonnées fichiers changent rarement

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB    # borne haute (documents) ; contrôle fin fait en code par contexte/fichier
      max-request-size: 60MB # POST /uploads/photos accepte plusieurs fichiers (photos[])

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME}
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# --- MinIO (stockage objet compatible S3) ---
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket: ${MINIO_BUCKET:serviloc-media}
  public-base-url: ${MINIO_PUBLIC_URL:http://localhost:9000/serviloc-media}

# --- Sécurité inter-services (endpoints /internal/**) ---
serviloc:
  internal-token: ${INTERNAL_TOKEN:changeme-internal-token}
  upload:
    photos:
      max-size-bytes: 5242880    # 5 Mo
      allowed-mime-types: image/jpeg,image/png,image/webp
    documents:
      max-size-bytes: 10485760   # 10 Mo
      allowed-mime-types: application/pdf,image/jpeg,image/png,image/webp

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: none
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.serviloc.fichiers: INFO
