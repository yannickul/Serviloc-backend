server:
  port: 8084

campay:
  username: ${CAMPAY_USERNAME}
  password: ${CAMPAY_PASSWORD}
  env: ${CAMPAY_ENV:DEV}
  base-url: https://demo.campay.net/api

spring:
  application:
    name: service-paiement

  datasource:
    url: ${DB_PAIEMENT_URL:jdbc:postgresql://localhost:5444/${POSTGRES_PAIEMENT_DB:db_paiement}}
    username: ${POSTGRES_PAIEMENT_USER:svc_paiement}
    password: ${POSTGRES_PAIEMENT_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 60000
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER:admin}
    password: ${RABBITMQ_DEFAULT_PASS}
    virtual-host: ${RABBITMQ_VHOST:/}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME}
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# ─── Resilience4j ────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      mobileMoney:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
      userService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 15s
        failureRateThreshold: 50
  retry:
    instances:
      mobileMoney:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
  timelimiter:
    instances:
      mobileMoney:
        timeoutDuration: 30s

# ─── Commission par défaut ────────────────────────────────────────
payment:
  commission:
    standard-rate: 10.0   # 10%
    urgency-rate: 15.0    # 15%

management:
  endpoints:
    web:
      exposure:
        include: "health,info,circuitbreakers"
  endpoint:
    health:
      show-details: always

internal:
  token: ${INTERNAL_TOKEN}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.serviloc: DEBUG
    org.springframework.amqp: INFO
    io.github.resilience4j: INFO