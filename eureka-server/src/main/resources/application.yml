
server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:eureka-server}
    prefer-ip-address: false
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Prod : on laisse le sync se faire normalement au démarrage du cluster
    wait-time-in-ms-when-sync-empty: 5000
    renewal-threshold-update-interval-ms: 15000
    # Prod : éviction moins agressive pour absorber les micro-coupures réseau
    eviction-interval-timer-in-ms: 60000
    # Prod : PROTECTION ACTIVÉE — empêche l'éviction en masse en cas d'incident réseau
    enable-self-preservation: true
# =============================================================================
# Actuator — Healthcheck exposé pour Docker Compose
# Docker Compose utilise GET /actuator/health pour le condition: service_healthy
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        # N'exposer que health et info — Eureka n'a pas besoin de plus
        include: "health,info"
      base-path: /actuator
  endpoint:
    health:
      # "always" pour que le healthcheck Docker voie le détail du statut
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

# =============================================================================
# Info — Métadonnées affichées sur /actuator/info
# =============================================================================
info:
  app:
    name: ServiLoc Eureka Server
    description: Service Discovery Registry for ServiLoc microservices
    version: 1.0.0
  environment:
    note: "Démarre en PREMIER avant tous les autres services"

# =============================================================================
# Logging
# =============================================================================
logging:
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
    org.springframework.cloud: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
