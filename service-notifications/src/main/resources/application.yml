server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: service-notifications

  datasource:
    url: ${DB_NOTIFS_URL:jdbc:postgresql://localhost:5446/${POSTGRES_NOTIFS_DB:db_notifications}}
    username: ${POSTGRES_NOTIFS_USER}
    password: ${POSTGRES_NOTIFS_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 60000
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Africa/Douala
    open-in-view: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 3
          multiplier: 2.0
        default-requeue-rejected: false

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME}
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# --- Messaging ServiLoc (RabbitMQ) ---
serviloc:
  messaging:
    exchange: serviloc.events
    queue: notifications.queue
    dlq: notifications.dlq
    dlx: serviloc.events.dlx
    routing-keys:
      - user.*
      - provider.*
      - agent.*
      - demand.*
      - negotiation.*
      - payment.*
      - litige.*
      - mission.*
  internal:
    # Jeton machine-à-machine partagé entre microservices (cf. INTERNAL_TOKEN)
    token: ${INTERNAL_TOKEN:}

  # --- Canaux de notification sortants ---
  firebase:
    enabled: ${FCM_ENABLED:true}
    credentials-path: ${FCM_CREDENTIALS_PATH:firebase-service-account.json}

  email:
    provider: resend
    api-key: ${RESEND_API_KEY:}
    # Expéditeur : domaine vérifié dans ton compte Resend.
    # En sandbox sans domaine vérifié, utilise "onboarding@resend.dev"
    # (Resend permet d'envoyer vers ta propre adresse avec cet expéditeur).
    from: ${EMAIL_FROM:onboarding@resend.dev}
    from-name: ${EMAIL_FROM_NAME:ServiLoc}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: none
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.serviloc.notifications: ${LOG_LEVEL:INFO}
